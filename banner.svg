<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&amp;display=swap');text{font-family:'JetBrains Mono','Courier New',monospace;}</style>
    <radialGradient id="rg" cx="0%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dca82" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#4dca82" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#0d1117"/>
  <rect width="1200" height="280" fill="url(#rg)"/>

  <!-- Icon mark at translate(60,100), exact MW paths on 64×64 viewbox -->
  <g transform="translate(60,100)">
    <circle cx="32" cy="32" r="2.75" fill="white"/>
    <path d="M35 32 L50 32" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M46.5 29 L50 32 L46.5 35" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M32 29 L32 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M29 17.5 L32 14 L35 17.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M29.5 34.5 L17 47" stroke="white" stroke-width="2" stroke-linecap="round" stroke-opacity="0.35"/>
    <path d="M20 43.5 L17 47 L20.5 50" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.35"/>
  </g>

  <!-- Vertical divider -->
  <rect x="152" y="88" width="1.5" height="60" fill="white" fill-opacity="0.1"/>

  <!-- Wordmark: wm(168, 138, 48) -->
  <text x="168" y="138" text-anchor="start" font-family="'JetBrains Mono','Courier New',monospace" font-size="48" letter-spacing="-2" text-rendering="optimizeLegibility">
    <tspan font-weight="700" fill="white">xyz</tspan><tspan font-weight="300" fill="rgba(255,255,255,0.24)">void</tspan>
  </text>

  <!-- Tagline -->
  <text x="60" y="196" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" font-weight="300" fill="rgba(255,255,255,0.26)" letter-spacing="0.5">Open-source tools, libraries and experiments. Built in the open.</text>
</svg>
